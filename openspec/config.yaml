schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Music App: a desktop Python music player, built from openspec/../initial_plan.md's
  4-phase roadmap (see below). Repo: github.com/dpulley/music-app.

  Tech stack:
    - Python 3.13, venv at repo root (venv/Scripts/python.exe on Windows)
    - just-playback (miniaudio-backed) for playback: play/pause/resume/stop/seek/
      set_volume, plus curr_pos/duration properties. Chosen specifically because it
      gives real seek() and position tracking, which Phase 4's progress bar needs.
    - mutagen for reading ID3/audio metadata (artist/album/title)
    - customtkinter for the GUI (Phase 3+)
    - pytest for tests

  Module boundaries:
    - src/audio_player/ - playback engine. Never imports from src/ui.
    - src/ui/ - GUI (customtkinter). Depends on audio_player, not vice versa.
    - src/database/ - playlist/metadata storage.
    - tests/ mirror src/ layout.

  Test policy: unit tests MUST mock just_playback.Playback - no test may require
  a real audio device or output hardware to pass. Use unittest.mock.

  Commit style: conventional commits (feat:, fix:, test:, chore:), one commit per
  openspec change increment, referencing the change id in the message.

  Roadmap (translate into sequential changes, one proposed at a time - do not
  propose change N+1 until change N is archived):
    1. add-audio-playback-core: Playback wrapper class (play/pause/resume/stop/
       seek/volume) over just_playback, a path-validation utility in src/utils.py,
       fully mocked unit tests.
    2. add-library-scan-and-cli: recursive directory scan for .mp3/.wav/.flac/.ogg,
       a Playlist model, and a CLI to list/select/play tracks.
    3. add-gui-player: customtkinter window - playlist sidebar, now-playing
       display, transport controls (play/pause/stop/skip) wired to the core.
    4. add-seek-metadata-search: progress bar + seek, mutagen-based metadata
       display, search/filter across the library, background position polling.

